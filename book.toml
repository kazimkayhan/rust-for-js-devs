[book]
title = "Rust for JS Devs"
authors = ["Kazim Kayhan"]
description = "A complete Rust tutorial for JavaScript developers, aligned with Rust by Example curriculum"
language = "en"
multilingual = false
src = "src"

[build]
build-dir = "book"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/kazimkayhan/rust-for-js-devs"
edit-url-template = "https://github.com/kazimkayhan/rust-for-js-devs/edit/master/{path}"

[output.html.playground]
editable = true
copyable = true
copy-js = true
line-numbers = false
runnable = true

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3
